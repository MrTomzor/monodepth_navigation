# do not modify these
root: ./
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
pre_window: export UAV_NAME=uav1; export RUN_TYPE=simulation; export UAV_TYPE=f450
startup_window: monodepth
windows:
  - roscore:
      layout: tiled
      panes:
        - roscore
  - gazebo:
      layout: tiled
      panes:
        #- waitForRos; roslaunch mrs_uav_gazebo_simulation simulation.launch world_file:=`rospack find monodepth`/gworlds/world2.sdf gui:=true
        - waitForRos; roslaunch mrs_uav_gazebo_simulation simulation.launch world_name:=forest gui:=true
        - waitForGazebo; rosservice call /mrs_drone_spawner/spawn "1 --$UAV_TYPE --enable-vio --enable-realsense-front --pos 2 2 2.5 -1.57"
        - waitForControl; gz camera -c gzclient_camera -f $UAV_NAME; history -s gz camera -c gzclient_camera -f $UAV_NAME
  - status:
      layout: tiled
      panes:
        - waitForHw; roslaunch mrs_uav_status status.launch
  - monodepth:
      layout: tiled
      panes:
        - waitForHw; roslaunch monodepth midas_node.launch
  - navigation:
      layout: tiled
      panes:
        - waitForHw; roslaunch monodepth navigation_node.launch
  - infra_p:
      layout: tiled
      panes:
        - waitForHw; roslaunch monodepth infra_node.launch
  - hw_api:
      layout: tiled
      panes:
        - waitForTime; roslaunch mrs_uav_px4_api api.launch
  - core:
      layout: tiled
      panes:
        - waitForHw; roslaunch mrs_uav_core core.launch
          platform_config:=`rospack find mrs_uav_gazebo_simulation`/config/mrs_uav_system/$UAV_TYPE.yaml
          custom_config:=./config/custom_config.yaml
          world_config:=./config/world_config.yaml
          network_config:=./config/network_config.yaml
  # - VINS:
  #     layout: tiled
  #     panes:
  #       - waitForHw; roslaunch ov_repub simulation_bluefox.launch

  # - VINS_republisher:
  #     layout: tiled
  #     panes:
  #       - waitForHw; roslaunch vins_republisher vins_republisher_openvins_bluefox.launch

  - vins_republisher:
      layout: tiled
      panes:
        - waitForHw; roslaunch mrs_vins_republisher vins_republisher_openvins_bluefox.launch
  - open_vins:
      layout: tiled
      panes:
        - waitForHw; roslaunch mrs_open_vins_core simulation_bluefox.launch
  - takeoff:
      layout: tiled
      panes:
        - waitForHw; roslaunch mrs_uav_autostart automatic_start.launch
        - waitForControl; rosservice call /$UAV_NAME/hw_api/arming 1; sleep 2; rosservice call /$UAV_NAME/hw_api/offboard
  
  - rviz:
      layout: tiled
      panes:
        # - waitForRos; roslaunch mrs_uav_core rviz.launch rviz_config:=/home/slon/user_ros_workspace/src/monodepth/rviz/rviz_config.rviz
        - rosrun rviz rviz -d /home/blueberry/user_ros_workspace/src/monodepth/rviz/depth_debug.rviz
        - waitForRos; roslaunch mrs_rviz_plugins load_robot.launch
        - waitForRos; roslaunch mrs_rviz_plugins rviz_interface.launch

