# do not modify these
root: ./
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
pre_window: export UAV_NAME=uav1; export RUN_TYPE=simulation; export UAV_TYPE=x500
startup_window: monodepth
windows:
  - roscore:
      layout: tiled
      panes:
        - roscore
  - simulator:
      layout: tiled
      panes:
        - waitForRos; roslaunch mrs_uav_unreal_simulation unreal_simulator.launch custom_config:=./config/simulator.yaml
  - status:
      layout: tiled
      panes:
        - waitForHw; roslaunch mrs_uav_status status.launch
  
  - monodepth:
      layout: tiled
      panes:
        - waitForHw; roslaunch monodepth_navigation midas_node.launch

  - navigation:
      layout: tiled
      panes:
         - waitForHw; roslaunch monodepth_navigation navigation_node.launch x_octogoal:=5 y_octogoal:=0 z_octogoal:=0 yaw_octogoal:=0
  - mapplan:
      layout: tiled
      panes:
        - waitForHw; roslaunch monodepth_navigation own_mapplan.launch
          config_octomap_server:=./config/octomap_server.yaml
          config_octomap_planner:=./config/octomap_planner.yaml
        # - waitForHw; roslaunch monodepth_navigation base_unreal_mapplan.launch
          # Old from monospheres
          # config_octomap_server:=/home/blueberry/mrs_apptainer/user_ros_workspace/src/monodepth_navigation/custom_configs/octomap_server.yaml
          # config_octomap_planner:=/home/blueberry/mrs_apptainer/user_ros_workspace/src/monodepth_navigation/custom_configs/octomap_planner.yaml
          # Config from unreal basic session
          #config_octomap_server:=./custom_configs/octomap_server.yaml
          #config_octomap_planner:=./custom_configs/octomap_planner.yaml 
  - hw_api:
      layout: tiled
      panes:
        - waitForTime; roslaunch mrs_uav_unreal_simulation hw_api.launch
  - vins_republisher:
      layout: tiled
      panes:
        - waitForHw; roslaunch mrs_vins_republisher vins_republisher_openvins_unreal.launch
  - open_vins:
      layout: tiled
      panes:
        - waitForHw; roslaunch mrs_open_vins_core simulation_unreal.launch
  - change_odom_source:
      layout: tiled
      panes:
        -  waitForControl; sleep 10; rosservice call /$UAV_NAME/estimation_manager/change_estimator "open_vins"
  - takeoff:
      layout: tiled
      panes:
        - waitForHw; roslaunch mrs_uav_autostart automatic_start.launch
        - waitForControl; rosservice call /$UAV_NAME/hw_api/arming 1; sleep 2; rosservice call /$UAV_NAME/hw_api/offboard
        # - waitForControl; rosservice call /$UAV_NAME/hw_api/arming 1; rosservice call /$UAV_NAME/uav_manager/midair_activation
  - control:
      layout: tiled
      panes:
        - waitForHw; roslaunch mrs_uav_core core.launch
          platform_config:=`rospack find mrs_multirotor_simulator`/config/mrs_uav_system/$UAV_TYPE.yaml
          custom_config:=./config/custom_config.yaml
          world_config:=./config/world_config.yaml
          network_config:=./config/network_config.yaml
  - rviz:
      layout: tiled
      panes:
        - waitForControl; rosrun rviz rviz -d ./rviz.rviz
        - waitForControl; roslaunch mrs_rviz_plugins load_robot.launch
        - waitForControl; roslaunch mrs_rviz_plugins rviz_interface.launch
  - layout:
      layout: tiled
      panes:
        - waitForControl; sleep 5; ~/.i3/layout_manager.sh ./layout.json








