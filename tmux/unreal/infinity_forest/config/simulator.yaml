uav_names: [
  "uav1",
]

frames:
  fcu:
    publish_tf: false

uav1:

  frame: "x500"
  type: "x500"
  spawn:
    x: 0.0
    y: 0.0
    z: 0.0
    heading: 0.0

mrs_uav_flightforge_simulator:

  sensors:

    lidar:

      enabled: true

    rgb:

      rate: 30 # [Hz]

      enabled: true
      offset_x: 5.0 # [m]
      offset_y: 0.0 # [m]
      offset_z: -0.9 # [m]

      rgb_segmented:
        enabled: false
        rate: 10.0 # [Hz]

      depth:
        enabled: false

    stereo:
      enabled: false

  graphics_settings: "medium"

  realtime_factor: 1.0 # [-]


  world_name: "infinite_forest"

  daytime:

    hour: 15
    minute: 30
