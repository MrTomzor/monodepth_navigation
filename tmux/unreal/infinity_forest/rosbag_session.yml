# do not modify these
root: ./
name: bag_simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf

# you can modify these
startup_window: status
pre_window: export UAV_NAME=uav1; export USE_SIM_TIME="true"; export RMW_IMPLEMENTATION=rmw_zenoh_cpp
windows:
  - router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd

  - rosbag:
      layout: tiled
      panes:
        - ros2 bag play ./forest_flight_lidar_01

  - status:
      layout: tiled
      panes:
        - ros2 run mrs_uav_status status.sh

  - monodepth:
      layout: tiled
      panes:
        - ros2 run monodepth_navigation monocular_depth_estimator --ros-args -p use_sim_time:=true

  - map_plan:
      layout: tiled
      panes:
        - ros2 launch mrs_octomap_mapping_planning mapplan.launch.py custom_config:=./config/mapplan_config.yaml depth_camera_0:=/midas/pointcloud_by_map depth_camera_0_info:=/uav1/rgb/camera_info

  - navigation:
      layout: tiled
      panes:
        - ros2 run monodepth_navigation navigation_controller --ros-args -p use_sim_time:=true -p x_octogoal:=5.0 -p y_octogoal:=0.0 -p z_octogoal:=0.0 -p yaw_octogoal:=0.0

  - rviz:
      layout: tiled
      panes:
        - ros2 run rviz2 rviz2 -d ./rviz.rviz --ros-args -p use_sim_time:=true

  - reconfigure:
      layout: tiled
      panes:
        - ros2 run rqt_reconfigure rqt_reconfigure

  - layout:
      layout: tiled
      panes:
        - sleep 5; ~/.i3/layout_manager.sh ./layout.json