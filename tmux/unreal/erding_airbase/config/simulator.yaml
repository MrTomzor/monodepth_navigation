uav_names: [
  "uav1",
]

uav1:
  frame: "a300"
  type: "x500"
  spawn:
    x: 90.0
    y: 65.0
    z: 0.1
    heading: -1.0

world_name:
  # "cave"
   #"valley"
  # "forest"
   #"infinite_forest"
  # "warehouse"
  # "cave"
   "erding_airbase"
  # "service_tunnel"
  #"eletric_towers"
  # "erding_airbase"
