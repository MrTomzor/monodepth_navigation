    mapping_origin_tf:
      odom_topic: "" # name of the topic (expects nav_msgs/Odometry topic type)
      enabled: true
      debug_prints: false
      lateral_topic: "point_lio/odometry" # name of the topic used for x, y components of the tf (expects nav_msgs/Odometry topic type)
      altitude_topic: "point_lio/odometry" # name of the topic  used for z components of the tf (expects nav_msgs/Odometry topic type)
